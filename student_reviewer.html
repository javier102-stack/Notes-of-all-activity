<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Search for Student</h1>
    <input type="numer" id="search-student" placeholder="Butangi ko men">
    <button id="student-out">Search</button>
    <button id="clear-button">Clear</button>
    <p id="outputs"></p>

    <script>
        const input = document.getElementById("search-student");
        let searchbtn = document.getElementById("student-out");
        let clear = document.getElementById("clear-button");
        const result = document.getElementById("outputs");

        searchbtn.addEventListener("click", function() {
            fetch("https://jsonplaceholder.typicode.com/posts")
            .then((response) => response.json())
            .then((data) => {

                const student_list = data.find((student) => student.id === Number(input.value));

                if(student_list){
                    result.innerHTML = `
                    <div>
                        <h3>${student_list.userId}</h3>
                        <h3>${student_list.id}</h3>
                        <p>${student_list.title}</p>
                        <p>${student_list.body}</p>
                    </div> `;
                }
                else{
                    throw new Error("Student not found");
                }
            })
            .catch((error) => {
                result.textContent = `Error: ${error}`;
            });
        });

        clear.addEventListener("click", function() {
            input.value = "";
            result.textContent = "";
        })
    </script>
</body>
</html>
