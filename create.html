<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="input-here">
    <button onclick="helloText()">Enter</button>
    <h1 id="result"></h1>

    <script>
        function helloText(){
            const hello = document.getElementById("input-here").value;

            document.getElementById("result").textContent = hello;
        }
    </script>
</body>
</html>
