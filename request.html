<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Post</h1>
    <h2 id="loading">Loading post</h2>
    <p id="result"></p>

    <script>
        const loading = document.getElementById("loading");
        const getData = fetch("https://jsonplaceholder.typicode.com/posts");
        const post = document.getElementById("result");


        getData
        .then((response) => response.json())
        .then((data) => {
            data.slice(0, 10).forEach((data) => {
                post.innerHTML += `
                    <h1>${data.userId}</h1>
                    <h2>${data.id}</h2>
                    <p>${data.body}</p>
            `
                });
        })

        .catch((error) => {
            console.log("error", error);
        });

    </script>
</body>
</html>
