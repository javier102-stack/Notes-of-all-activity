<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            background-color: aliceblue;
        }
    </style>


    <h2>Selected Color: <span id="selected">None</span></h2>
    <div id="buttons">
    <button id="color1">Red</button>
    <button id="color2">Blue</button>
    <button id="color3">Green</button>
    <button id="color4">Yellow</button>
    <div>
        <button id="reset">reset</button>

    <script>
        const red = document.getElementById("color1");
        const blue = document.getElementById("color2");
        const green = document.getElementById("color3");
        const yellow = document.getElementById("color4");
        const result = document.getElementById("selected");

        let reset = document.getElementById("reset");

        red.addEventListener("click", function() {
            document.body.style.background = "red";
            result.textContent = "Red";
        });

        blue.addEventListener("click", function() {
            document.body.style.background = "blue";
            result.textContent = "Blue";
        });

        green.addEventListener("click", function() {
            document.body.style.background = "green";
            result.textContent = "Green";
        });

        yellow.addEventListener("click", function() {
            document.body.style.background = "yellow";
            result.textContent = "Yellow";
        });

        reset.addEventListener("click", function() {
            document.body.style.background = "";
            result.textContent = "None";
        });

        // const button = document.getElementById("hello");

        // button.addEventListener("click", function() {
        //     color = ["blue", "orange", "red", "green", "yellow", "brown"];
        //     random = color[Math.floor(Math.random() * color.length)];

        //     document.body.style.background = random;
        // })

        
    </script>
</body>
</html>
